services:
  db:
    image: postgres:15
    container_name: setu_swasthya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - setu_swasthya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setu_swasthya_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ml/ integration: the triage/escalation rule engine now lives at
      # repo-root ml/{triage,escalation}/rules.py, a sibling of this
      # backend/ folder, not inside it -- kept deliberately modular per
      # the ml/ integration (see ml/README.md). WORKDIR below is /app
      # (this backend/ folder's content, via the volume mount below) and
      # is already on sys.path implicitly (uvicorn adds its own cwd).
      # The `ml` bind mount below lands the repo-root ml/ folder at
      # container path /ml; adding "/" to PYTHONPATH is what makes
      # `import ml.triage.rules` / `import ml.escalation.rules` resolve
      # against that mount, matching backend/app/services/{triage,
      # escalation}/{adapter,factory}.py's own updated imports.
      PYTHONPATH: /
    volumes:
      - .:/app
      - ../ml:/ml
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  setu_swasthya_pgdata:
